name: backend-check
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the live desk functions
        run: |
          B=https://sexxnfpnrkyuiartjpya.supabase.co/functions/v1
          echo "intake OPTIONS (expect 200): $(curl -s -o /dev/null -w '%{http_code}' -X OPTIONS -H 'Origin: https://patrician.ch' $B/intake)"
          echo "intake POST empty (expect 400): $(curl -s -X POST -H 'content-type: application/json' -d '{}' $B/intake)"
          echo "letter GET bad token (expect 302): $(curl -s -o /dev/null -w '%{http_code}' "$B/letter?t=00000000000000000000000000000000&a=confirm")"
          echo "generate without key (expect 403): $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"order_id":"x"}' $B/generate)"
          echo "release without key (expect 403): $(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{"order_id":"x"}' $B/release)"
          echo "stripe-webhook (expect 503 until keys exist, then 400): $(curl -s -o /dev/null -w '%{http_code}' -X POST -d '{}' $B/stripe-webhook)"
